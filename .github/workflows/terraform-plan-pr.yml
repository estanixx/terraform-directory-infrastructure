name: Terraform Plan (PR)

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gh-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (S3 backend)
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=05-tf-directory/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_simple_ad_password_ssm_parameter_name: ${{ secrets.SIMPLE_AD_PASSWORD_SSM_PARAMETER_NAME }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -var-file=ci.auto.tfvars -out=tfplan > plan.txt
          ec=$?
          set -e

          echo "plan_exit_code=$ec" >> "$GITHUB_OUTPUT"
          echo "Terraform plan exit code: $ec"

          if [ "$ec" -eq 1 ]; then
            echo "Terraform plan failed"
            cat plan.txt
            exit 1
          fi

          if [ "$ec" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-pr-${{ github.run_id }}
          path: plan.txt

      - name: Add plan summary
        run: |
          {
            echo "## Terraform Plan"
            echo
            echo "Has changes: ${{ steps.plan.outputs.has_changes }}"
            echo "Plan exit code: ${{ steps.plan.outputs.plan_exit_code }}"
            echo
            echo "<details><summary>Show plan output</summary>"
            echo
            echo '```text'
            sed -n '1,400p' plan.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan.txt', 'utf8').slice(0, 65000);
            const marker = '<!-- terraform-plan-comment -->';
            const comment = `${marker}\n## Terraform Plan\n\n\`\`\`text\n${body}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: comment,
              });
            }
